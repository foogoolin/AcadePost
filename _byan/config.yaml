user_name: Ilya
communication_language: Russian
document_output_language: Francais
output_folder: '{project-root}/_byan-output'
agents_folder: '{project-root}/_byan/agents'
byan_version: 2.0.0
bmad_features:
  enabled: true
  glossary:
    enabled: true
    min_concepts: 5
    auto_trigger_domains:
      - ecommerce
      - finance
      - healthcare
      - insurance
      - banking
    validation:
      min_definition_length: 20
      clarity_threshold: 0.7
  five_whys:
    enabled: true
    auto_trigger: true
    trigger_questions:
      - 4
      - 5
    max_depth: 5
    pain_keywords:
      - problem
      - issue
      - challenge
      - difficult
      - slow
      - complex
      - error
      - fail
      - break
      - bug
      - struggle
      - hard
      - confusing
      - frustrating
      - annoying
      - painful
      - blocking
      - stuck
  active_listening:
    enabled: true
    reformulate_every: 3
    validate_at_phase_end: true
    auto_summarize: true
  mantras:
    validate: true
    min_score: 80
    enforce_on_generation: true
    fail_on_low_score: false
    categories:
      - merise-agile
      - ia
  voice_integration:
    enabled: true
    auto_detect: true
    suggest_on_long_form: true
    platforms:
      - github-copilot-cli
      - claude-code
      - codex
memory_sync:
  enabled: true
