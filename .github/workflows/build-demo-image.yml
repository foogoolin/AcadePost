name: Build demo image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.demo
      - .dockerignore
      - apps/**
      - libraries/**
      - deploy/demo/**
      - var/docker/nginx.conf
      - ecosystem.demo.config.cjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - .github/workflows/build-demo-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foogoolin/acadepost
  ACADEPOST_IMAGE_MAX_COMPRESSED_MB: "900"

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image for size gate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: false
          outputs: type=oci,dest=/tmp/acadepost-image.tar
          build-args: |
            NEXT_PUBLIC_VERSION=v${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size before push
        shell: bash
        run: |
          max_bytes=$((ACADEPOST_IMAGE_MAX_COMPRESSED_MB * 1024 * 1024))
          size_bytes="$(stat -c%s /tmp/acadepost-image.tar)"
          size_mb="$(( (size_bytes + 1024 * 1024 - 1) / 1024 / 1024 ))"

          echo "OCI image archive size: ${size_mb} MB"
          echo "Limit: ${ACADEPOST_IMAGE_MAX_COMPRESSED_MB} MB"

          if (( size_bytes > max_bytes )); then
            echo "Image is too large. Optimize Dockerfile.demo before publishing this build." >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:demo
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.package-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=v${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
