name: Build demo image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.demo
      - .dockerignore
      - docker-compose.demo.yaml
      - docker-compose.demo.shared-infra.yaml
      - .env.demo.example
      - .env.demo.shared-infra.example
      - apps/**
      - libraries/**
      - deploy/demo/**
      - scripts/docker/**
      - var/docker/nginx.conf
      - ecosystem.demo.config.cjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig*.json
      - .github/workflows/build-demo-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: foogoolin/acadepost
  ACADEPOST_IMAGE_TARGET_COMPRESSED_MB: "700"
  ACADEPOST_IMAGE_MAX_COMPRESSED_MB: "900"

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Compose install paths
        shell: bash
        run: |
          docker compose --env-file .env.demo.example -f docker-compose.demo.yaml config --quiet
          docker compose --env-file .env.demo.shared-infra.example -f docker-compose.demo.shared-infra.yaml config --quiet

          if docker compose --env-file .env.demo.example -f docker-compose.demo.yaml config | grep -qE '^[[:space:]]+build:'; then
            echo "Demo compose must not contain build: in the install path." >&2
            exit 1
          fi

          if docker compose --env-file .env.demo.shared-infra.example -f docker-compose.demo.shared-infra.yaml config | grep -qE '^[[:space:]]+build:'; then
            echo "Shared-infra compose must not contain build: in the install path." >&2
            exit 1
          fi

      - name: Guard Docker build context
        shell: bash
        run: |
          forbidden='(^|/)(\.env(\.|$)|\.mcp(\.json)?(/|$)|\.codex/(agents|config\.toml|hooks|hooks\.json)(/|$)|\.agents/|_byan-output/|reports/|secrets/|\.secrets/)'
          if git ls-files | grep -E "$forbidden" | grep -vE '^\.env(\.demo(\.shared-infra)?|)\.example$' | grep -vE '^\.env\.example$'; then
            echo "Tracked local/runtime or secret-like files would be sent to Docker context." >&2
            exit 1
          fi

      - name: Test update script failure gate
        shell: bash
        run: bash scripts/docker/test-update-script.sh

      - name: Build image for size gate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: false
          outputs: type=oci,dest=/tmp/acadepost-image.tar
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size before push
        shell: bash
        run: |
          max_bytes=$((ACADEPOST_IMAGE_MAX_COMPRESSED_MB * 1024 * 1024))
          target_bytes=$((ACADEPOST_IMAGE_TARGET_COMPRESSED_MB * 1024 * 1024))
          size_bytes="$(stat -c%s /tmp/acadepost-image.tar)"
          size_mb="$(( (size_bytes + 1024 * 1024 - 1) / 1024 / 1024 ))"

          echo "OCI image archive size: ${size_mb} MB"
          echo "Target: ${ACADEPOST_IMAGE_TARGET_COMPRESSED_MB} MB"
          echo "Limit: ${ACADEPOST_IMAGE_MAX_COMPRESSED_MB} MB"

          if (( size_bytes > target_bytes )); then
            echo "Image is above the target size; this is a warning until the hard limit is reached." >&2
          fi

          if (( size_bytes > max_bytes )); then
            echo "Image is too large. Optimize Dockerfile.demo before publishing this build." >&2
            exit 1
          fi

      - name: Build image for container smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: false
          load: true
          tags: acadepost:ci-smoke
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Compose stack
        shell: bash
        run: |
          set -euo pipefail
          env_file=".env.demo.ci"
          cp .env.demo.example "$env_file"
          {
            echo "ACADEPOST_IMAGE=acadepost:ci-smoke"
            echo "ACADEPOST_PUBLIC_URL=http://127.0.0.1:4007"
            echo "ACADEPOST_DEMO_DB_PUSH=true"
          } >> "$env_file"

          cleanup() {
            docker compose --env-file "$env_file" -f docker-compose.demo.yaml down -v --remove-orphans || true
          }
          trap cleanup EXIT

          if ! docker compose --env-file "$env_file" -f docker-compose.demo.yaml up -d --no-build; then
            docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps || true
            docker compose --env-file "$env_file" -f docker-compose.demo.yaml logs --tail=200 acadepost-migrate acadepost-backend acadepost-frontend acadepost-orchestrator acadepost || true
            exit 1
          fi

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4007/api/monitor/ready >/dev/null; then
              break
            fi

            if (( attempt % 10 == 0 )); then
              docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps
            fi

            sleep 4
          done

          if ! curl -fsS http://127.0.0.1:4007/api/monitor/ready >/dev/null; then
            docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps
            docker compose --env-file "$env_file" -f docker-compose.demo.yaml logs --tail=200
            exit 1
          fi

          for service in acadepost-backend acadepost-frontend acadepost-orchestrator acadepost; do
            for attempt in $(seq 1 180); do
              container_id="$(docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps -q "$service")"
              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container_id")"

              if [[ "$health" == "healthy" || ( -z "$health" && "$state" == "running" ) ]]; then
                break
              fi

              if [[ "$health" == "unhealthy" || "$state" == "exited" || "$state" == "dead" ]]; then
                docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps
                docker compose --env-file "$env_file" -f docker-compose.demo.yaml logs --tail=200 "$service"
                exit 1
              fi

              if [[ "$attempt" == "180" ]]; then
                docker compose --env-file "$env_file" -f docker-compose.demo.yaml ps
                docker compose --env-file "$env_file" -f docker-compose.demo.yaml logs --tail=200 "$service"
                exit 1
              fi

              sleep 3
            done
          done

          echo "Compose smoke passed."
          exit 0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:demo
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.package-version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.package-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
