services:
  acadepost:
    image: ${ACADEPOST_IMAGE:-ghcr.io/foogoolin/acadepost:v1.1.0}
    container_name: acadepost
    restart: unless-stopped
    environment:
      MAIN_URL: ${ACADEPOST_PUBLIC_URL:-http://localhost:4007}
      FRONTEND_URL: ${ACADEPOST_PUBLIC_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?NEXT_PUBLIC_BACKEND_URL is required}
      BACKEND_INTERNAL_URL: http://127.0.0.1:3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://acadepost-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_STATIC_DIRECTORY: /uploads
      IS_GENERAL: "true"
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      PUBLIC_API_ALLOW_OAUTH: ${PUBLIC_API_ALLOW_OAUTH:-false}
      ACADEPOST_DEMO_DB_PUSH: ${ACADEPOST_DEMO_DB_PUSH:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACADEPOST_CREDENTIALS_ENCRYPTION_KEY: ${ACADEPOST_CREDENTIALS_ENCRYPTION_KEY:-}
      API_LIMIT: ${API_LIMIT:-30}
      NX_ADD_PLUGINS: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEXT_PUBLIC_DISCORD_SUPPORT: ${NEXT_PUBLIC_DISCORD_SUPPORT:-}
      NEXT_PUBLIC_POLOTNO: ${NEXT_PUBLIC_POLOTNO:-}
      X_URL: ${X_URL:-}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      DISABLE_X_ANALYTICS: ${DISABLE_X_ANALYTICS:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BEEHIIVE_API_KEY: ${BEEHIIVE_API_KEY:-}
      BEEHIIVE_PUBLICATION_ID: ${BEEHIIVE_PUBLICATION_ID:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      GOOGLE_GMB_CLIENT_ID: ${GOOGLE_GMB_CLIENT_ID:-}
      GOOGLE_GMB_CLIENT_SECRET: ${GOOGLE_GMB_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      DRIBBBLE_CLIENT_ID: ${DRIBBBLE_CLIENT_ID:-}
      DRIBBBLE_CLIENT_SECRET: ${DRIBBBLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN_ID: ${DISCORD_BOT_TOKEN_ID:-}
      SLACK_ID: ${SLACK_ID:-}
      SLACK_SECRET: ${SLACK_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      MASTODON_URL: ${MASTODON_URL:-https://mastodon.social}
      MASTODON_CLIENT_ID: ${MASTODON_CLIENT_ID:-}
      MASTODON_CLIENT_SECRET: ${MASTODON_CLIENT_SECRET:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_SECRET: ${KICK_SECRET:-}
      VK_ID: ${VK_ID:-}
      NEYNAR_CLIENT_ID: ${NEYNAR_CLIENT_ID:-}
      NEYNAR_SECRET_KEY: ${NEYNAR_SECRET_KEY:-}
      NEYNAR_LOGIN_URL: ${NEYNAR_LOGIN_URL:-}
      MEWE_HOST: ${MEWE_HOST:-https://mewe.com}
      MEWE_APP_ID: ${MEWE_APP_ID:-}
      MEWE_API_KEY: ${MEWE_API_KEY:-}
      WHOP_CLIENT_ID: ${WHOP_CLIENT_ID:-}
      NEXT_PUBLIC_FACEBOOK_PIXEL: ${NEXT_PUBLIC_FACEBOOK_PIXEL:-}
      FEE_AMOUNT: ${FEE_AMOUNT:-0.05}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SIGNING_KEY: ${STRIPE_SIGNING_KEY:-}
      STRIPE_SIGNING_KEY_CONNECT: ${STRIPE_SIGNING_KEY_CONNECT:-}
      NODE_OPTIONS: --max-old-space-size=${NODE_RUNTIME_MAX_OLD_SPACE_SIZE:-4096}
    expose:
      - "5000"
    volumes:
      - ${ACADEPOST_DATA_DIR:-./data}/config:/config
      - ${ACADEPOST_DATA_DIR:-./data}/uploads:/uploads
    networks:
      - proxy
      - backend
      - acadepost-network
      - temporal-network
    depends_on:
      acadepost-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/monitor/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  acadepost-redis:
    image: redis:7.2-alpine
    container_name: acadepost-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - ${ACADEPOST_DATA_DIR:-./data}/redis:/data
    networks:
      - acadepost-network

  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    volumes:
      - ${ACADEPOST_DATA_DIR:-./data}/temporal-elasticsearch:/usr/share/elasticsearch/data

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=${TEMPORAL_POSTGRES_PORT:-5432}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:?TEMPORAL_POSTGRES_PASSWORD is required}
      - POSTGRES_SEEDS=${TEMPORAL_POSTGRES_HOST:-postgres}
      - DBNAME=${TEMPORAL_DB:-temporal}
      - VISIBILITY_DBNAME=${TEMPORAL_VISIBILITY_DB:-temporal_visibility}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - BIND_ON_IP=0.0.0.0
      - TEMPORAL_NAMESPACE=default
    networks:
      - backend
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.34.0
    restart: unless-stopped
    profiles:
      - debug
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=${ACADEPOST_PUBLIC_URL:-http://localhost:4007}
    networks:
      - temporal-network
    ports:
      - "${TEMPORAL_UI_BIND:-127.0.0.1}:${TEMPORAL_UI_PORT:-8080}:8080"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
  backend:
    external: true
    name: ${BACKEND_NETWORK:-backend}
  acadepost-network:
  temporal-network:
